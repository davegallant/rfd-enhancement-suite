name: "Generate Tampermonkey script"
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  userscript:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build script.js
        run: npm run build:userscript

      - name: Fail if script.js is stale
        if: github.event_name == 'pull_request'
        run: git diff --exit-code script.js

      - name: Commit regenerated script.js
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: script.js
          commit_message: "chore: regenerate userscript"
