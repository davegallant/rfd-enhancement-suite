name: "Build"
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: Install jq
        run: sudo apt-get install jq

      - name: Get extension version
        id: vars
        run: |
          version=$(jq -r .version manifest.json)
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: "web-ext build"
        id: web-ext-build
        uses: kewisch/action-web-ext@v2
        with:
          cmd: build
          source: .
          filename: "rfd-enhancement-suite-${{steps.vars.outputs.version}}-${{steps.vars.outputs.sha_short}}.xpi"
          ignoreFiles: '[ "package.json", "package-lock.json", "yarn.lock", "*.test.js", "docs/**", "web-ext-artifacts/**", "extensions/**", "test/**", "test-results/**", "playwright-report/**", "playwright.config.cjs" ]'

      - name: "Upload Artifact"
        uses: actions/upload-artifact@v7
        with:
          name: "rfd-enhancement-suite-${{steps.vars.outputs.version}}-${{steps.vars.outputs.sha_short}}.xpi"
          path: ${{ steps.web-ext-build.outputs.target }}
