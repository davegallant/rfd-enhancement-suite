<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>RFD Enhancement Suite</title>
    <link rel="stylesheet" href="../css/popup.css" />
  </head>
  <body>
    <header class="popup-header">
      <span class="brand-mark" aria-hidden="true">R</span>
      <h1>RFD Enhancement Suite</h1>
    </header>
    <p id="activity-count" class="page-activity" role="status">Loading page activity…</p>
    <p id="appearance-page-status" role="status"></p>
    <section id="appearance-section" aria-labelledby="appearance-heading">
      <h2 id="appearance-heading">Browsing</h2>
      <label class="switch-row"><span><strong>Clean links</strong><small>Open direct, tracking-free URLs</small></span><input id="link-cleaning-enabled" type="checkbox" /></label>
      <label class="switch-row"><span><strong>Remove clutter</strong><small>Promotions and secondary details</small></span><input id="modern-clutter-enabled" type="checkbox" /></label>
      <label class="switch-row"><span><strong>Modern layout</strong><small>Cleaner rows and easier reading</small></span><input id="modern-enabled" type="checkbox" /></label>
      <details id="customize-cleanup"><summary>Customize cleanup</summary>
        <form id="appearance-form">
          <label class="check"><input id="modern-hide-promotions" type="checkbox" /> Hide promotions and sponsored threads</label>
          <label class="check"><input id="modern-hide-sidebar" type="checkbox" /> Hide sidebar</label>
          <label class="check"><input id="modern-hide-footer" type="checkbox" /> Hide footer</label>
          <label class="check"><input id="modern-hide-signatures" type="checkbox" /> Hide signatures</label>
          <label class="check"><input id="modern-compact-profiles" type="checkbox" /> Compact author details</label>
        </form>
      </details>
      <p id="appearance-status" role="status" aria-live="polite"></p>
      <p id="link-cleaning-status" role="status" aria-live="polite"></p>
    </section>
    <details id="link-tools"><summary>Advanced</summary>
      <details><summary>Recent cleaned links</summary><p class="hint">Up to 50 changes on this page.</p><ol id="activity-links"></ol></details>
      <form id="test-form">
        <label for="test-url">Test a link</label>
        <input type="url" id="test-url" placeholder="https://…" required />
        <button id="test-button" type="submit">Test link</button>
        <p class="hint">Preview the destination without opening it.</p>
        <output id="test-result" aria-live="polite"></output><ol id="test-steps"></ol>
      </form>
      <p id="last-update"></p><p id="update-error" role="status"></p>
      <label for="input-field">Rules URL</label>
      <input type="url" id="input-field" />
      <div class="actions"><button id="save-button" type="button">Save rules URL</button><button id="reset-button" type="button">Use default</button></div>
      <div id="status-message" role="status"></div>
      <button id="appearance-reset" type="button">Reset appearance</button>
      <p class="hint"><a href="whats-new.html" target="_blank">What’s new in 1.2</a></p>
    </details>
    <script src="../js/stripRedirect.js"></script>
    <script src="../js/theme/settings.js"></script>
    <script src="../js/popupAppearance.js"></script>
    <script type="module" src="../js/popup.js"></script>
  </body>
</html>
